name: Provision FedPulse Vectorize

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/provision-vectorize.yml"

jobs:
  provision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 4e921a01da1f55b0ddb32bb38a5524ce
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Vectorize index exists
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler@4 vectorize get fedpulse-opportunities-v1 --json >/tmp/vectorize.json 2>/tmp/vectorize.err; then
            cat /tmp/vectorize.json
          else
            cat /tmp/vectorize.err >&2 || true
            npx wrangler@4 vectorize create fedpulse-opportunities-v1 \
              --dimensions=1024 \
              --metric=cosine \
              --description="FedPulse semantic opportunity retrieval"
          fi
          npx wrangler@4 vectorize get fedpulse-opportunities-v1 --json
