name: FedPulse CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Python tests
        run: PYTHONPATH=src uv run python -m unittest discover -s tests -v
      - name: Compile Python
        run: uv run python -m compileall -q src tests scripts
      - name: Validate JSON configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('src/fedpulse/config').glob('*.json'):
              json.loads(path.read_text())
              print(path)
          PY
      - name: Validate dashboard JavaScript syntax
        run: node --check dashboard/app.js && node --check worker/src/index.js
      - name: Validate shell scripts
        run: bash -n scripts/nightly.sh

  live-source-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/live-source-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: [oira_meetings, grants, usaspending, sam, bill_status]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Exercise ${{ matrix.source }} against live government data
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          PYTHONPATH=src uv run python - <<'PY'
          import json, os
          from fedpulse import congress_bulk_client, grants_client, oira_meetings_client, reginfo_client, sam_opportunities_client, usaspending_client

          source = os.environ['SOURCE']
          if source == 'oira_meetings':
              docs = reginfo_client.pull_oira_pending() + reginfo_client.pull_oira_completed_30()
              rins = list(dict.fromkeys(d.rin for d in docs if d.rin))[:25]
              found = []
              checked = []
              for rin in rins:
                  checked.append(rin)
                  events = oira_meetings_client.pull_for_rin(rin)
                  if events:
                      found.extend(events)
                      break
              print('OIRA_REVIEW_RECORDS=' + str(len(docs)))
              print('OIRA_RINS_CHECKED=' + json.dumps(checked))
              print('OIRA_MEETINGS=' + str(len(found)))
              for e in found[:5]: print('SAMPLE=' + json.dumps(e.__dict__, default=str, sort_keys=True))
              if not docs: raise SystemExit('RegInfo returned zero OIRA review records')
          elif source == 'grants':
              url, digest, events = grants_client.pull_latest()
              print('SOURCE_URL=' + url); print('SHA256=' + digest); print('EVENTS=' + str(len(events)))
              for e in events[:5]: print('SAMPLE=' + json.dumps(e.__dict__, default=str, sort_keys=True))
              if not events: raise SystemExit('Grants.gov returned zero opportunities')
          elif source == 'usaspending':
              events = usaspending_client.pull_recent_awards(days=3)
              print('EVENTS=' + str(len(events)))
              for e in events[:5]: print('SAMPLE=' + json.dumps(e.__dict__, default=str, sort_keys=True))
              if not events: raise SystemExit('USAspending returned zero recent awards')
          elif source == 'sam':
              url, digest, events = sam_opportunities_client.pull_current()
              print('SOURCE_URL=' + url); print('SHA256=' + digest); print('EVENTS=' + str(len(events)))
              for e in events[:5]: print('SAMPLE=' + json.dumps(e.__dict__, default=str, sort_keys=True))
              if not events: raise SystemExit('SAM.gov returned zero opportunities')
          elif source == 'bill_status':
              events = congress_bulk_client.pull_recent_updates(max_files=25)
              print('EVENTS=' + str(len(events)))
              for e in events[:5]: print('SAMPLE=' + json.dumps(e.__dict__, default=str, sort_keys=True))
              if not events: raise SystemExit('Bill Status returned zero recent updates')
          PY

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy FedPulse dashboard Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4e921a01da1f55b0ddb32bb38a5524ce
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
