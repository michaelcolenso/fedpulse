name: FedPulse CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Python tests
        run: PYTHONPATH=src uv run python -m unittest discover -s tests -v
      - name: Compile Python
        run: uv run python -m compileall -q src tests scripts
      - name: Validate JSON configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('src/fedpulse/config').glob('*.json'):
              json.loads(path.read_text())
              print(path)
          PY
      - name: Validate dashboard JavaScript syntax
        run: node --check dashboard/app.js && node --check worker/src/index.js
      - name: Validate shell scripts
        run: bash -n scripts/nightly.sh

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy FedPulse dashboard Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4e921a01da1f55b0ddb32bb38a5524ce
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc
