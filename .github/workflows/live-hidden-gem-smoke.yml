name: Live Hidden Gem Smoke
on:
  pull_request:
    paths:
      - 'src/fedpulse/**'
      - 'tests/test_hidden_gems.py'
      - '.github/workflows/live-hidden-gem-smoke.yml'
permissions:
  contents: read
jobs:
  live-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Fetch live SAM + Grants opportunity corpus and rank
        env:
          PYTHONPATH: src
        run: |
          uv run python - <<'PY'
          import datetime as dt, json, tempfile
          from pathlib import Path
          from fedpulse import db, grants_client, sam_opportunities_client
          from fedpulse.action_graph import link_exact_identifiers, upsert_events
          from fedpulse.opportunities import rank_all_profiles
          from fedpulse.hidden_gems import detect_hidden_gems
          root=Path(tempfile.mkdtemp()); conn=db.connect(root/'live.db'); db.init_db(conn)
          grants_url,_,grants=grants_client.pull_latest(); upsert_events(conn,grants); conn.commit()
          sam_url,_,sam=sam_opportunities_client.pull_current(); upsert_events(conn,sam); link_exact_identifiers(conn); conn.commit()
          as_of=dt.datetime.now(dt.timezone.utc).date().isoformat()
          by_profile,lanes,items=rank_all_profiles(conn,as_of,60)
          gems=[]
          for profile in ('default','ai_technology','business_opportunities','pnw_intelligence'):
              for item in detect_hidden_gems(conn,as_of,profile,12): gems.append({**item,'profile':profile})
          gems.sort(key=lambda x:(-x['hidden_gem_score'],-x['score']))
          def compact(x):
              return {k:x.get(k) for k in ('event_id','title','agency','stage','event_date','amount','score','edge','days_to_close','official_url','reasons','profiles','hidden_gem_score','hidden_gem_reasons','historical_context') if k in x}
          print('CORPUS_COUNTS='+json.dumps({'grants':len(grants),'sam':len(sam),'total':len(grants)+len(sam)},sort_keys=True))
          print('TOP_EARLY='+json.dumps([compact(x) for x in items if x.get('edge')=='early'][:15],sort_keys=True))
          print('TOP_ACT_NOW='+json.dumps([compact(x) for x in lanes.get('act_now',[])[:15]],sort_keys=True))
          print('TOP_HIDDEN_GEMS='+json.dumps([compact(x) for x in gems[:20]],sort_keys=True))
          PY
