name: FedPulse semantic production smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/semantic-smoke.yml"

jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 4e921a01da1f55b0ddb32bb38a5524ce
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.FEDPULSE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.FEDPULSE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://4e921a01da1f55b0ddb32bb38a5524ce.r2.cloudflarestorage.com
      R2_BUCKET: fedpulse-state
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Restore production state
        run: aws s3 cp s3://$R2_BUCKET/fedpulse.db /tmp/fedpulse.db --endpoint-url "$R2_ENDPOINT"
      - name: Embed 500 current opportunities with Workers AI
        run: PYTHONPATH=src uv run python scripts/bootstrap_vectorize.py --db /tmp/fedpulse.db --out /tmp/fedpulse-vectors.ndjson --profile default --limit 500
      - name: Upsert production vectors
        run: npx --yes wrangler@4 vectorize upsert fedpulse-opportunities-v1 --file=/tmp/fedpulse-vectors.ndjson --batch-size=500
      - name: Allow asynchronous Vectorize mutation to settle
        run: sleep 12
      - name: Query production index for construction/AEC profile
        shell: bash
        run: |
          PYTHONPATH=src uv run python - <<'PY'
          import json, os, urllib.request
          q=json.load(open('/tmp/fedpulse-vectors.ndjson.query.json'))
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/vectorize/v2/indexes/fedpulse-opportunities-v1/query'
          body=json.dumps({'vector':q['vector'],'topK':20,'returnMetadata':'all'}).encode()
          req=urllib.request.Request(url,data=body,headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=120) as r: data=json.load(r)
          print(json.dumps({'profile':q['profile'],'result':data.get('result'),'success':data.get('success'),'errors':data.get('errors')},indent=2))
          if not data.get('success'): raise SystemExit(1)
          matches=(data.get('result') or {}).get('matches') or []
          if not matches: raise SystemExit('no semantic matches returned')
          PY
