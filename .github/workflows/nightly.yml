name: FedPulse nightly pipeline

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch: {}

concurrency:
  group: fedpulse-nightly
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.FEDPULSE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.FEDPULSE_R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  R2_ENDPOINT: https://4e921a01da1f55b0ddb32bb38a5524ce.r2.cloudflarestorage.com
  R2_BUCKET: fedpulse-state
  R2_DB_KEY: fedpulse.db
  CLOUDFLARE_ACCOUNT_ID: 4e921a01da1f55b0ddb32bb38a5524ce
  CLOUDFLARE_KV_NAMESPACE_ID: 4df2d8d44f8d495e810fc3b888a4885b

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Restore state.db from R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          set +e
          HEAD_OUTPUT=$(aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "$R2_DB_KEY" \
            --endpoint-url "$R2_ENDPOINT" 2>&1)
          HEAD_CODE=$?
          set -e

          if [ "$HEAD_CODE" -eq 0 ]; then
            aws s3 cp "s3://${R2_BUCKET}/${R2_DB_KEY}" data/fedpulse.db --endpoint-url "$R2_ENDPOINT"
            PYTHONPATH=src uv run python scripts/validate_state.py data/fedpulse.db --write-json /tmp/fedpulse-baseline.json
            cp data/fedpulse.db data/fedpulse.before.db
          elif printf '%s' "$HEAD_OUTPUT" | grep -Eqi '(404|Not Found|NoSuchKey)'; then
            echo "No prior state object exists in R2; bootstrapping a fresh database."
          else
            echo "$HEAD_OUTPUT" >&2
            echo "R2 restore failed for a reason other than a missing object; refusing to bootstrap." >&2
            exit "$HEAD_CODE"
          fi

      - name: Run nightly pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=src uv run python -m fedpulse.pipeline_v2 \
            --db data/fedpulse.db --out data/outputs

      - name: Validate generated state before persistence
        run: |
          if [ -f /tmp/fedpulse-baseline.json ]; then
            PYTHONPATH=src uv run python scripts/validate_state.py data/fedpulse.db \
              --baseline-json /tmp/fedpulse-baseline.json \
              --write-json /tmp/fedpulse-current.json
          else
            PYTHONPATH=src uv run python scripts/validate_state.py data/fedpulse.db \
              --write-json /tmp/fedpulse-current.json
          fi

      - name: Back up previous state and persist validated state to R2
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(date -u +'%Y%m%dT%H%M%SZ')
          if [ -f data/fedpulse.before.db ]; then
            aws s3 cp data/fedpulse.before.db "s3://${R2_BUCKET}/history/${stamp}-pre-run.db" \
              --endpoint-url "$R2_ENDPOINT"
          fi
          aws s3 cp data/fedpulse.db "s3://${R2_BUCKET}/${R2_DB_KEY}" \
            --endpoint-url "$R2_ENDPOINT"

      - name: Dereference output symlinks for upload
        if: always()
        run: |
          if [ -d data/outputs ]; then
            cp -rL data/outputs data/outputs-flat
          fi

      - name: Upload output snapshot (debug artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedpulse-outputs-${{ github.run_id }}
          path: data/outputs-flat
          retention-days: 14
          if-no-files-found: warn

      - name: Publish complete dashboard generation to Cloudflare KV
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PYTHONPATH=src uv run python scripts/publish_dashboard.py \
            data/outputs-flat/current --legacy-flat
