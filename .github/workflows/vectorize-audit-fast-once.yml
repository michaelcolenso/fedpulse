name: FedPulse fast Vectorize audit (one-off)

on:
  push:
    branches: [main]
    paths: [.github/workflows/vectorize-audit-fast-once.yml]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.FEDPULSE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.FEDPULSE_R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  R2_ENDPOINT: https://4e921a01da1f55b0ddb32bb38a5524ce.r2.cloudflarestorage.com
  R2_BUCKET: fedpulse-state
  R2_DB_KEY: fedpulse.db
  CLOUDFLARE_ACCOUNT_ID: 4e921a01da1f55b0ddb32bb38a5524ce

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Restore production state and published feed
        run: |
          mkdir -p data/outputs/current
          aws s3 cp "s3://${R2_BUCKET}/${R2_DB_KEY}" data/fedpulse.db --endpoint-url "$R2_ENDPOINT"
          curl -fsSL https://fedpulse-dashboard.aged-morning-c8e4.workers.dev/data/outputs/current/opportunities_today.json \
            -o data/outputs/current/opportunities_today.json
      - name: Run Vectorize discovery audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PYTHONPATH=src uv run python scripts/vectorize_discovery.py \
            --db data/fedpulse.db \
            --feed data/outputs/current/opportunities_today.json \
            --audit data/outputs/vectorize_precision_audit.json \
            --top-k 200 \
            --min-similarity 0.50
          cat data/outputs/vectorize_precision_audit.json
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: vectorize-fast-audit-${{ github.run_id }}
          path: |
            data/outputs/vectorize_precision_audit.json
            data/outputs/current/opportunities_today.json
          retention-days: 7
